[build-system]
requires = ["setuptools>=64", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[project]
name = "microdatawiggler"
version = "0.1.0"
description = "Python client library for the Microdatawiggler gRPC debug server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "grpcio",
    "protobuf",
]

[tool.setuptools.packages.find]
where = ["src"]
